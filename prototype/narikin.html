<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>目押し成金</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&family=DotGothic16&display=swap">
<style>
/* Layout: one phone column. A status strip (day, cash, three meters) stays on top; below it the screen swaps between the room, the hall floor and the machine. Single night-hall look. */
:root{
  --bg:#0f0d17; --panel:#1c1830; --panel2:#2a2445; --line:#3b3460; --chrome:#c9c3da; --paper:#f4efe2; --ink:#15101f;
  --neon:#ff3b6b; --gold:#ffcf4a; --cyan:#3fd9ff; --ok:#7dffa0; --dim:#a29cba; --bad:#ff8f7a;
  --hun:#ffb15c; --fun:#c38bff; --hp:#6fe39a;
  --disp:"Dela Gothic One","Hiragino Kaku Gothic ProN",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --dot:"DotGothic16",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--paper);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
#app{max-width:460px;margin:0 auto;padding-block:10px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
h1,h2,p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--disp);font-weight:400;font-size:23px;letter-spacing:.06em;color:var(--gold)}
.mini{font:inherit;font-size:13px;color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer}
.status{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.status .day{font-family:var(--dot);font-size:13px;color:var(--dim)}
.status .cash{font-family:var(--disp);font-weight:400;font-size:22px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{grid-column:1/3;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.mt .r{display:flex;justify-content:space-between;gap:4px}
.mt .r b{font-family:var(--dot);font-weight:400}
.bar{height:7px;border-radius:4px;background:var(--ink);overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.mt.low .r{color:var(--bad)}
#view{display:flex;flex-direction:column;gap:10px}
.ch{font-size:13px;color:var(--cyan);letter-spacing:.06em}
.lead{font-family:var(--disp);font-weight:400;font-size:20px;line-height:1.4;text-wrap:balance}
.sub{font-size:14px;color:var(--dim)}
.room{line-height:0;background:var(--panel);border-radius:10px;overflow:hidden;border:2px solid var(--line);background:var(--ink)}
.room canvas{width:100%;height:auto;display:block;image-rendering:pixelated;touch-action:manipulation}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd{font:inherit;text-align:left;background:var(--panel);color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.cmd b{font-family:var(--disp);font-weight:400;font-size:17px;line-height:1.3}
.cmd span{font-size:13px;color:var(--dim);line-height:1.4}
.cmd .p{color:var(--gold);font-family:var(--dot);font-size:13px}
.cmd.wide{grid-column:1/-1}
.cmd.main{background:linear-gradient(var(--panel2),var(--panel));border-color:var(--gold)}
.cmd.on{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.cmd:disabled{opacity:.42;cursor:default}
.btn{font-family:var(--disp);font-size:18px;letter-spacing:.05em;width:100%;padding:10px;color:var(--ink);background:var(--gold);border:2px solid var(--paper);border-radius:10px;cursor:pointer;box-shadow:0 4px 0 #7a5a00}
.btn:disabled{filter:grayscale(1) brightness(.5);cursor:default}
.btn.alt{font-family:var(--body);font-weight:700;font-size:15px;background:var(--panel);color:var(--paper);border-color:var(--line);box-shadow:none;padding:8px}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tab{font:inherit;font-size:14px;flex:none;padding:5px 12px;border-radius:999px;background:var(--panel);color:var(--paper);border:1px solid var(--line);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.inv{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;display:flex;align-items:center;gap:5px;padding:4px 9px 4px 4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--paper);cursor:pointer}
.chip canvas{width:24px;height:24px;image-rendering:pixelated;border-radius:50%;background:var(--panel2)}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2)}
.mach{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.mach canvas{width:62px;height:84px;image-rendering:pixelated}
.data{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--dot);font-size:12px;color:var(--paper)}
.data span{color:var(--dim)}
.cab{background:linear-gradient(var(--panel2),var(--panel));border:2px solid var(--chrome);border-radius:14px;padding:9px;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 3px var(--ink)}
.cabtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cabtop b{font-family:var(--disp);font-weight:400;font-size:18px;color:var(--gold)}
.counter{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--ink);border-radius:8px;padding:6px}
.counter div{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--dim);min-width:0}
.counter b{font-family:var(--dot);font-weight:400;font-size:15px;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
.counter b.pos{color:var(--ok)}.counter b.neg{color:var(--bad)}
.lamp{min-height:40px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;border-radius:8px;background:var(--ink);font-size:15px;padding:5px 8px}
.lamp b{font-family:var(--disp);font-weight:400;color:var(--gold)}
.lamp.hot{box-shadow:inset 0 0 0 2px var(--neon);animation:hot .5s steps(2) infinite}
.lamp.mode{box-shadow:inset 0 0 0 2px var(--gold)}
@keyframes hot{50%{background:#3a1424}}
.glass{position:relative;line-height:0}
.glass canvas{display:block;margin:0 auto;max-width:100%}
.pop{position:absolute;top:2px;transform:translateX(-50%);font-family:var(--disp);font-size:19px;line-height:1.1;white-space:nowrap;pointer-events:none;text-shadow:0 2px 0 var(--ink);animation:pop .9s ease-out forwards}
.pop.bita{color:var(--gold);font-size:23px}.pop.ok{color:var(--ok)}.pop.ng{color:var(--dim)}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.12);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-16px);opacity:0}}
.ctrl{display:grid;grid-template-columns:66px 1fr;gap:9px}
.lever{font-family:var(--disp);font-size:14px;color:var(--ink);background:radial-gradient(circle at 50% 30%,#ff7c98,var(--neon) 60%);border:3px solid var(--chrome);border-radius:50%;aspect-ratio:1;width:66px;cursor:pointer;box-shadow:0 4px 0 var(--ink);touch-action:manipulation}
.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stop{position:relative;font-family:var(--disp);font-size:14px;color:var(--ink);background:linear-gradient(#fff6c9,var(--gold));border:3px solid var(--chrome);border-radius:12px;min-height:66px;cursor:pointer;box-shadow:0 4px 0 var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stop .nv{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--neon);color:var(--paper);font-size:13px;border-radius:999px;padding:0 8px;line-height:1.5}
.lever:disabled,.stop:disabled{filter:grayscale(1) brightness(.45);cursor:default}
.lever:active:not(:disabled),.stop:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.picks{display:grid;gap:8px}
.picks.p3{grid-template-columns:repeat(3,1fr)}
.picks.p8{grid-template-columns:repeat(4,1fr)}
.door{font-family:var(--disp);font-size:20px;aspect-ratio:3/4;border-radius:8px;border:2px solid var(--gold);background:linear-gradient(#5a3a1a,#3a2410);color:var(--gold);cursor:pointer}
.door.gone{opacity:.18;cursor:default}
.door.win{background:var(--gold);color:var(--ink)}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:15px}
.res b{font-family:var(--dot);font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
.res .big{font-family:var(--disp);font-size:24px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.strip{background:var(--panel);border-radius:10px;padding:8px 10px;font-size:14px}.strip summary{cursor:pointer}.strip canvas{display:block;margin:8px auto 0;max-width:100%;height:auto}
.island{display:flex;flex-direction:column;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px}
.ihead{display:grid;grid-template-columns:31px 1fr;gap:9px;align-items:center}.ihead canvas{width:31px;height:42px;image-rendering:pixelated}
.ihead div{display:flex;flex-direction:column;min-width:0;font-size:12px;color:var(--dim);line-height:1.4}.ihead b{font-family:var(--disp);font-weight:400;font-size:16px;color:var(--paper)}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.unit{font:inherit;display:flex;flex-direction:column;gap:1px;min-width:0;text-align:left;background:var(--panel2);color:var(--paper);border:1px solid var(--line);border-radius:9px;padding:6px 7px;cursor:pointer;font-size:11px;line-height:1.35}
.unit:disabled{opacity:.42;cursor:default}
.unit .no{display:flex;justify-content:space-between;gap:4px;font-size:12px}.unit .no i{font-style:normal;font-size:11px}
.unit b{font-family:var(--disp);font-weight:400;font-size:20px;line-height:1.2}.unit span{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .tag{color:var(--cyan)}
.friend{display:flex;flex-direction:column;gap:5px;background:var(--panel);border-radius:10px;padding:8px 10px;font-size:13px}.friend .r{display:flex;justify-content:space-between}.friend p{color:var(--dim)}
.log{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:7px 16px;border-radius:999px;font-weight:700;z-index:20;white-space:nowrap;font-size:14px}
.cut{position:fixed;left:0;right:0;top:36%;z-index:31;pointer-events:none;background:var(--ink);border-block:3px solid var(--gold);color:var(--gold);text-align:center;font-family:var(--disp);font-size:clamp(28px,9vw,42px);letter-spacing:.1em;padding:12px 0;animation:cut 1s steps(10) forwards}
@keyframes cut{0%{transform:translateX(100%)}18%,82%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.pop,.cut{animation-duration:.01s}.lamp.hot{animation:none}.bar i{transition:none}}
</style>

<div id="app">
  <div class="top"><h1>目押し成金</h1><button class="mini" id="snd" type="button">音 OFF</button></div>
  <div class="status" id="status"></div>
  <div id="view"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/*LOGIC-START*/
const N=21, ROT_MS=750, FRAME_MS=ROT_MS/N, MAX_SLIP=4;
// 21-frame reels. Bells and replays sit at most 5 frames apart so they always slide onto a line.
// Both left-reel cherries sit directly under a BAR, and watermelons 3 frames above the left BARs (2 on the other reels), so a missed cherry or watermelon can always be kicked off the left reel, so the big symbols are the aiming marks.
const STRIPS=[['R7','RP','R7','BL','RP','BL','CH','BAR','RP','BL','WM','RP','RP','RP','BL','CH','BAR','RP','BL','WM','BL'],['R7','BL','RP','RP','BL','BAR','RP','WM','RP','BL','R7','RP','RP','RP','BL','BAR','RP','WM','BL','BL','RP'],['R7','RP','BAR','BL','WM','RP','BL','BL','BL','RP','BL','R7','RP','BAR','BL','WM','RP','RP','RP','BL','BL']];
const BITA_IDX=1; // the replay between the two 7s on the left reel
const mod=(a,n=N)=>((a%n)+n)%n;
function makeReel(strip){return {strip,pos:Math.floor(Math.random()*N),state:'stop',speed:1,noSlip:false,res:null}}
function posAt(r,t){
  if(r.state==='spin')return r.p0+(t-r.t0)/FRAME_MS*r.speed;
  if(r.state==='slide')return Math.min(r.final,r.p0+(t-r.t0)/FRAME_MS*r.speed);
  return r.pos;
}
// Pressing stops the reel at the next frame boundary, then the machine may slide up to 4 frames to pull the target onto the centre line.
function press(r,t,target,allowSlip=true){
  const p=posAt(r,t),base=Math.ceil(p-1e-9);
  let s=0;
  if(allowSlip&&!r.noSlip){for(let k=0;k<=(r.maxSlip??MAX_SLIP);k++)if(r.strip[mod(base+k)]===target){s=k;break}}
  const sym=r.strip[mod(base+s)],hit=sym===target;
  let off=0;
  if(!hit){let e=99,l=99;for(let k=1;k<=10;k++){if(e===99&&r.strip[mod(base+k)]===target)e=k;if(l===99&&r.strip[mod(base-k)]===target)l=k}off=e<=l?e:-l}
  r.p0=p;r.t0=t;r.final=base+s;r.tEnd=t+(base+s-p)*FRAME_MS/r.speed;r.state='slide';
  r.res={hit,slip:s,bita:hit&&s===0,sym,off,ms:Math.round((base-p)*FRAME_MS/r.speed)};
  return r.res;
}
function hitDamage(res,chance){if(!res.hit)return 0;return (res.bita?30:8+(MAX_SLIP-res.slip)*3)*(chance?2:1)}
/*LOGIC-END*/
function drawSym(c,k,x,y,w,h){
  const cx=x+w/2,cy=y+h/2,s=Math.min(w,h*1.5);
  c.save();c.lineJoin='round';
  if(k==='R7'||k==='B7'){
    c.font=`${h*.86}px "Dela Gothic One",sans-serif`;c.textAlign='center';c.textBaseline='middle';
    c.lineWidth=h*.14;c.strokeStyle='#15101f';c.strokeText('7',cx,cy+h*.04);
    c.lineWidth=h*.07;c.strokeStyle='#ffffff';c.strokeText('7',cx,cy+h*.04);
    c.fillStyle=k==='R7'?'#e3203f':'#2a6fe0';c.fillText('7',cx,cy+h*.04);
  }else if(k==='BAR'){
    const bw=s*.62,bh=h*.26;
    for(const dy of [-.17,.17]){c.fillStyle='#15101f';rr(c,cx-bw/2,cy+dy*h-bh/2,bw,bh,bh*.25);c.fill();c.fillStyle='#f4efe2';c.font=`${bh*.78}px "Dela Gothic One",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('BAR',cx,cy+dy*h+bh*.04)}
  }else if(k==='BL'){
    const b=h*.36;c.fillStyle='#f0b400';c.strokeStyle='#15101f';c.lineWidth=h*.05;
    c.beginPath();c.moveTo(cx-b*.95,cy+b*.7);c.quadraticCurveTo(cx-b*.6,cy+b*.45,cx-b*.62,cy);c.quadraticCurveTo(cx-b*.6,cy-b*.95,cx,cy-b*.98);c.quadraticCurveTo(cx+b*.6,cy-b*.95,cx+b*.62,cy);c.quadraticCurveTo(cx+b*.6,cy+b*.45,cx+b*.95,cy+b*.7);c.closePath();c.fill();c.stroke();
    c.beginPath();c.arc(cx,cy+b*.82,b*.18,0,7);c.fill();c.stroke();
    c.fillStyle='#fff3b0';c.fillRect(cx-b*.38,cy-b*.6,b*.14,b*.8);
  }else if(k==='WM'){
    const R=h*.4;c.beginPath();c.moveTo(cx-R,cy-R*.15);c.arc(cx,cy-R*.15,R,0,Math.PI);c.closePath();
    c.fillStyle='#2f9e44';c.fill();c.lineWidth=h*.05;c.strokeStyle='#15101f';c.stroke();
    c.beginPath();c.moveTo(cx-R*.8,cy-R*.15);c.arc(cx,cy-R*.15,R*.8,0,Math.PI);c.closePath();c.fillStyle='#e8344e';c.fill();
    c.fillStyle='#15101f';for(const [a,b] of [[-.4,.2],[0,.35],[.4,.2],[-.15,.55],[.2,.55]]){c.beginPath();c.ellipse(cx+a*R,cy-R*.15+b*R,R*.06,R*.1,0,0,7);c.fill()}
  }else if(k==='CH'){
    const R=h*.17;c.strokeStyle='#2f7a3a';c.lineWidth=h*.05;
    c.beginPath();c.moveTo(cx-R*1.2,cy+R*.6);c.quadraticCurveTo(cx-R*.4,cy-R*1.6,cx+R*.6,cy-R*2);c.moveTo(cx+R*1.3,cy+R*.3);c.quadraticCurveTo(cx+R*1.1,cy-R*1.4,cx+R*.6,cy-R*2);c.stroke();
    for(const [a,b] of [[-1.2,.9],[1.3,.6]]){c.beginPath();c.arc(cx+a*R,cy+b*R,R,0,7);c.fillStyle='#d61f3c';c.fill();c.lineWidth=h*.04;c.strokeStyle='#15101f';c.stroke();c.fillStyle='#ffd0d8';c.beginPath();c.arc(cx+a*R-R*.35,cy+b*R-R*.35,R*.25,0,7);c.fill()}
  }else if(k==='RP'){
    c.fillStyle='#1f5fd1';c.textAlign='center';c.textBaseline='middle';c.font=`${h*.25}px "Dela Gothic One",sans-serif`;
    c.fillText('RE',cx,cy-h*.14);c.fillText('PLAY',cx,cy+h*.15);
  }
  c.restore();
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ---------- reels ---------- */
let cv=null,rc=null,reels=[],RW=90,RH=54,PAD=8,GAP=8,dpr=1;
function layout(){
  if(!cv||!document.body.contains(cv))return;
  const n=reels.length||1,cw=Math.min(428,(cv.parentElement&&cv.parentElement.clientWidth)||360);
  RW=Math.min(n===1?130:999,(cw-2*PAD-(n-1)*GAP)/n);RH=Math.max(44,Math.round(RW*.6));
  const W=n*RW+(n-1)*GAP+2*PAD,H=3*RH+2*PAD;dpr=Math.min(3,window.devicePixelRatio||1);
  cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
}
window.addEventListener('resize',layout);
function drawReels(now){
  if(!rc)return;const c=rc;c.setTransform(dpr,0,0,dpr,0,0);
  const W=cv.width/dpr,H=cv.height/dpr;
  c.fillStyle='#15101f';c.fillRect(0,0,W,H);
  reels.forEach((r,n)=>{
    const x=PAD+n*(RW+GAP),y0=PAD,cy=y0+1.5*RH,p=posAt(r,now);
    c.save();rr(c,x,y0,RW,3*RH,6);c.clip();
    c.fillStyle='#f4efe2';c.fillRect(x,y0,RW,3*RH);
    for(let i=Math.floor(p)-2;i<=Math.ceil(p)+2;i++){const yc=cy+(p-i)*RH;drawSym(c,r.strip[mod(i)],x,yc-RH/2,RW,RH)}
    const g=c.createLinearGradient(0,y0,0,y0+3*RH);g.addColorStop(0,'rgba(21,16,31,.62)');g.addColorStop(.28,'rgba(21,16,31,0)');g.addColorStop(.72,'rgba(21,16,31,0)');g.addColorStop(1,'rgba(21,16,31,.62)');
    c.fillStyle=g;c.fillRect(x,y0,RW,3*RH);
    if(r.state==='stop'&&r.res&&r.res.hit){c.strokeStyle=r.res.bita?'#ffcf4a':'#7dffa0';c.lineWidth=3;c.strokeRect(x+2,cy-RH/2+1,RW-4,RH-2)}
    c.restore();
    if(r.noSlip){c.strokeStyle='#ff3b6b';c.lineWidth=3;rr(c,x-1,y0-1,RW+2,3*RH+2,7);c.stroke();c.fillStyle='#ff3b6b';c.font='12px "Zen Kaku Gothic New",sans-serif';c.textAlign='center';c.fillText('滑りなし',x+RW/2,y0+12)}
  });
  c.fillStyle='#ff3b6b';const cy=PAD+1.5*RH;
  c.beginPath();c.moveTo(0,cy-6);c.lineTo(PAD-1,cy);c.lineTo(0,cy+6);c.fill();
  c.beginPath();c.moveTo(W,cy-6);c.lineTo(W-PAD+1,cy);c.lineTo(W,cy+6);c.fill();
}

function evTime(e){const n=performance.now(),t=e&&e.timeStamp;return (t&&t<=n+5&&t>n-1000)?t:n}

const LINES=[[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]],LINE_N=['上段','中段','下段','右下がり','右上がり'];

      best=Math.max(best,un.length===1?(finalBad(n,rs,o)?0:1):finishShare(rs,n,o,memo))}

function drawSym(c,k,x,y,w,h){

    c.save();c.translate(cx,cy+bh*.04);c.transform(1,0,-.28,1,0,0);c.scale(1.45,1);c.font=`${bh*.6}px "Dela Gothic One",sans-serif`;c.textAlign='center';c.textBaseline='middle';

function tone(f,d,type='square',v=.08,slide=1){if(!soundOn||!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide!==1)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
const SND={lever:()=>tone(180,.08,'square',.1,.6),stop:()=>tone(95,.05,'square',.14),bita:()=>{tone(1320,.12,'triangle',.12);setTimeout(()=>tone(1760,.18,'triangle',.12),70)},pay:()=>tone(880,.06,'square',.06),miss:()=>tone(140,.15,'triangle',.08,.7),fan:()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.16,'square',.09),i*90)),coin:()=>tone(1500,.05,'triangle',.07)};

function drawRoom(c,home,placed,sel,t){
  const H=HOMES[home],W=H.w*16,Hh=H.h*16+20;
  const [f1,f2]=FLOORS[H.floor];
  R(c,0,0,W,20,home===4?'#1b2550':home===0?'#8f8a7a':'#e8e1d0');

  else if(home===4){for(let i=0;i<W;i+=6)R(c,i,3+(i*7%9),2,2,'#ffcf4a');R(c,0,17,W,3,'#c9c3da')}
  else{R(c,0,17,W,3,'#b9b0a0');R(c,W-34,4,26,10,'#9fd0f0');R(c,W-21,4,1,10,'#ffffff')}
  for(let y=0;y<H.h;y++)for(let x=0;x<H.w;x++){R(c,x*16,20+y*16,16,16,(x+y)%2?f1:f2);if(H.floor==='tatami')R(c,x*16,20+y*16,16,1,'#a8925a')}

function roulette(i){

function makeFloor(){
  const ev=isEvent(S.day),H=hallState(hallIdx),prev=H.cur&&H.cur.day===S.day-1?H.cur:null,ms=[];let no=101;
  ['fuku','fuku','fuku','sanj','sanj','sanj','hachi','hachi','hachi'].forEach((k,idx)=>{const m=MACH[k],s2=pickSetting(Math.random(),ev),g=3000+Math.floor(Math.random()*4500),p=m.big(s2),
    big=Math.max(0,Math.round(g*p+(Math.random()-.5)*2*Math.sqrt(g*p))),rp=m.reg?m.reg(s2):0,reg=Math.max(0,Math.round(g*rp+(Math.random()-.5)*2*Math.sqrt(g*rp+1))),
    diff=Math.round(g*3*((.9+s2*.035)-1)+(Math.random()-.5)*2400),star=s2>=4?Math.random()<.6:Math.random()<.12;
    const pm=m.big(3)+(m.reg?m.reg(3):0),close=prev&&prev.ms[idx].played?prev.ms[idx].since:Math.min(CEIL[k]-30,Math.floor(-Math.log(1-Math.random())*0.6/pm));
    const reset=Math.random()<HALLS[hallIdx].reset;
    ms.push({no:no++,k,s:s2,g,big,reg,diff,star,since:reset?0:close,close,reset,taken:false,played:false})});
  H.cur={day:S.day,ms,ticket:null,ev};
  if(!ev){const busy=ms.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,2+Math.floor(Math.random()*2));busy.forEach(i=>ms[i].taken=true)}

  P.g++;P.order=[];P.navi=-1;P.hint=-1;P.res=[];P.wins=null;
  tick();
  if(P.mode==='normal'){P.flag=P.pend||roll(mach(),P.s,Math.random());P.pend=null;
    if(P.flag==='BIG'||P.flag==='REG'){const b=P.flag;if(Math.random()<.5){P.mode='align';P.bonus=b;SND.fan();P.flag='BONUS'}else{P.post=b;P.flag=null}}
    else if(P.flag==='CH'&&Math.random()<P.m.dup){P.post=P.m.reg&&Math.random()<.4?'REG':'BIG';P.dupCH=true}
    if(P.flag==='BL'&&P.m.kind==='sanj'){P.navCorrect=Math.floor(Math.random()*3);if(Math.random()<.3)P.hint=P.navCorrect}
  }else if(P.mode==='at'){P.flag=atRoll(Math.random());if(P.flag==='BL'){P.navCorrect=Math.floor(Math.random()*3);P.navi=P.navCorrect}}
  else if(P.mode==='align')P.flag='BONUS';
  else if(P.mode==='big')P.flag='BIGG';else if(P.mode==='reg')P.flag='BL';else if(P.mode==='zen')P.flag='R7';
  const sp=speedMul(),ms=maxSlip(),now=performance.now();
  reels.forEach((r,i)=>{r.res=null;r.speed=sp;r.maxSlip=ms;r.noSlip=P.mode==='big'&&i===0;r.p0=r.pos;r.t0=now;r.state='spin'});
  P.spinning=true;SND.lever();renderPlay();
}
function targetFor(i){
  const f=P.flag,k=P.m.kind;
  if(f==='R7')return P.mode==='zen'?(i===1?'R7':null):'R7';
  if(f==='BONUS')return i<2?'R7':(P.bonus==='REG'?'BAR':'R7');
  if(f==='BIGG')return i===0?null:'BL';
  if(f==='RP')return 'RP';
  if(f==='BL'){if(k==='sanj'){const first=P.order[0];return first===P.navCorrect?'BL':null}return 'BL'}
  if(f==='CH')return k==='fuku'?(i===0?'CH':null):(i===0?'CH':null);
  if(f==='WM')return 'WM';
  return null;
}
function stopAt(i,e){
  const r=reels[i];if(!r||r.state!=='spin')return;
  if(P.mode==='big'&&i!==0&&reels[0].state==='spin'){toast('BIG中は左リールから止めます');return}
  if(P.navi>=0&&P.mode==='at'&&P.order.length===0&&i!==P.navi)P.navMiss=true;
  P.order.push(i);
  const tg=targetFor(i),done=reels.map((x,j)=>j!==i&&x.state!=='spin'?x.final:null);
  const res=pressL(reels,i,evTime(e),tg,{done,centerOnly:P.mode==='big'&&i===0,hide:leftHide(),must:(['BL','RP'].includes(tg)&&P.flag!=='BONUS')?tg:null,tgs:P.flag==='BONUS'?[0,1,2].map(targetFor):null,noBonusLine:noBonusLine(),last:P.order.length===3,ok:okLines(tg)});
  if(P.mode==='big'&&i===0){const fi=mod(r.final),d=mod(BITA_IDX-fi);res.bita=fi===BITA_IDX;res.hit=res.bita;res.off=res.bita?0:(d<=10?d:d-21)}
  r.res=res;
  P.res[i]=res;SND.stop();
  r.onStop=()=>{landed(i,res)};sync();
}
// What the left reel may never show. A watermelon sliding onto the left reel always means watermelon or something better.
function leftHide(){const h=[];if(P.flag!=='CH')h.push('CH');if(P.mode==='normal'&&P.flag!=='WM'&&!P.post)h.push('WM');return h}
// A bonus line (7-7-7 or 7-7-BAR) must only appear when that bonus actually starts.
function noBonusLine(){if(P.flag==='BONUS')return P.bonus==='REG'?['R7']:['BAR'];return ['R7','BAR']}
function okLines(tg){if(P.flag==='BONUS')return P.bonus==='BIG'?['BAR','R7']:['BAR'];if(P.post)return ['BAR'];return tg?[tg]:[]}
function paying(){return ['RP','BL','CH','WM','R7'].includes(P.flag)}
function landed(i,res){
  const f=P.flag;
  if(P.mode==='big'&&i===0){if(res.bita){SND.bita();P.flashT=performance.now();popAt(0,'ビタ！','bita')}else{SND.miss();popAt(0,offText(res),'ng')}}
  else if(P.mode==='zen'){if(i===1){if(res.bita){SND.bita();popAt(1,'ビタ！ 扉-2','bita')}else if(res.hit){popAt(1,'扉-1','ok')}else{SND.miss();popAt(1,offText(res),'ng')}}}
  else if(f==='R7'||f==='BAR'){if(res.hit)popAt(i,(['上段','中段','下段'][res.row]),'ok');else{SND.miss();popAt(i,offText(res),'ng')}}
  else if(f==='CH'&&i===0&&res.hit)popAt(0,'チェリー','ok');
  sync();
  if(reels.every(r=>r.state==='stop')){P.spinning=false;const fs=reels.map(x=>x.final);P.wins=[...lineWins(fs,reels),...bonusLines(fs,reels,'R7'),...bonusLines(fs,reels,'BAR')].filter(w=>!(w.sym==='R7'));settle()}
}
function popAt(i,text,cls){const g=$('#glass');if(!g)return;const x=PAD+i*(RW+GAP)+RW/2,el=document.createElement('div');el.className='pop '+cls;el.textContent=text;el.style.left=((g.clientWidth-cv.clientWidth)/2+x)+'px';g.appendChild(el);setTimeout(()=>el.remove(),950)}
function offText(res){if(res.off>0)return res.off+'コマ早い';if(res.off<0)return(-res.off)+'コマ遅い';return 'ハズレ'}
function gain(n,why){if(n>0){P.medals+=n;SND.pay()}if(why)P.log.push(why)}
function settle(){
  const f=P.flag,k=P.m.kind,res=P.res,all=f==='BONUS'?(P.wins||[]).some(w=>w.sym===P.bonus):!!f&&(P.wins||[]).some(w=>w.sym===f);
  if(P.mode==='normal'){
    const on=x=>(P.wins||[]).some(w=>w.sym===x);
    if(f==='RP'){if(on('RP'))gain(PAY.RP);else P.log.push('リプレイこぼし')}
    else if(f==='BL'){if(k==='sanj'){const ok=P.order[0]===P.navCorrect&&on('BL');gain(ok?PAY.BLok:PAY.BLng,ok?'3択正解 ベル9枚':'押し順ミス 1枚')}else if(on('BL'))gain(PAY.BL);else P.log.push('ベルこぼし（変則押し）')}
    if(f!=='BL'&&on('BL'))gain(k==='sanj'?PAY.BLok:PAY.BL);if(f!=='RP'&&on('RP'))gain(PAY.RP);
    else if(f==='CH'){if(k==='fuku')gain(res[0].hit?PAY.CHf:0,res[0].hit?'チェリー 4枚':'チェリーこぼし');else gain(PAY.CHo)}
    else if(f==='WM'){gain(all?PAY.WM:0,all?'スイカ 12枚':'スイカこぼし')}
  }else if(P.mode==='align'){
    if(all){
      bonusStarted();
      if(P.bonus==='REG'){P.reg=(P.reg||0)+1;P.mode='reg';P.left=REG_G;cutin('REG');P.log.push('7・7・BAR REG')}
      else{P.big++;if(k==='fuku'){P.mode='big';P.left=BIG_G;cutin('BIG');P.log.push('7・7・7 BIG')}else if(k==='sanj'){P.mode='at';P.left=AT_G;cutin('侍ラッシュ')}else{P.mode='zen';P.left=ZEN_G;P.doors=[0,1,2,3,4,5,6,7];P.winDoor=Math.floor(Math.random()*8);cutin('扉チャンス')}}
      SND.fan();P.post=null;
    }else P.log.push('そろわず。もう一度');
  }else if(P.mode==='big'){
    const ok=res[0].bita,okPay=BITA_OK+(has('bita10')?2:0);gain(ok?okPay:BITA_NG,ok?'ビタ成功 '+okPay+'枚':'ビタ失敗 '+BITA_NG+'枚');S.bitaRun=ok?S.bitaRun+1:0;if(S.bitaRun>=10)grant('bita10');P.bitaN=(P.bitaN||0)+(ok?1:0);P.left--;if(P.left<=0){P.mode='normal';P.log.push('BIG終了');S.fun=clamp(S.fun+6)}
  }else if(P.mode==='reg'){
    gain(REG_PAY);P.left--;if(P.left<=0){P.mode='normal';P.log.push('REG終了');S.fun=clamp(S.fun+3)}
  }else if(P.mode==='at'){
    if(f==='BL')gain(P.order[0]===P.navi?PAY.BLok:PAY.BLng);else if(f==='RP')gain(PAY.RP);
    P.left--;if(P.left<=0){P.mode='cont';P.contWin=Math.floor(Math.random()*3)}
  }else if(P.mode==='zen'){
    const n=res[1].bita?2:res[1].hit?1:0;if(n){const wrong=P.doors.filter(d=>d!==P.winDoor).sort(()=>Math.random()-.5).slice(0,n);P.doors=P.doors.filter(d=>!wrong.includes(d));P.log.push(n===2?'中段ビタ 扉が2つ消えた':'赤7 扉が1つ消えた')}else P.log.push('赤7を外した')
    P.left--;if(P.left<=0)P.mode='door';
  }
  if(P.post&&P.mode==='normal'){P.mode='align';P.bonus=P.post;P.post=null;SND.fan();if(P.dupCH){cutin('チェリー重複');P.dupCH=false}else toast('ボーナス確定！')}
  P.flag=null;S.play.medals=P.medals;S.play.inv=P.inv;save();
  if(S.hp<=0)return collapse();
  renderPlay();
}
function bonusStarted(){grant('first');if(P.ceilHit){grant('ceil');cutin('天井')}else if(P.startSince>=400&&P.g<=CEIL[P.m.kind]-P.startSince)grant('hyena');P.since=0;P.ceilHit=false;P.startSince=0}
function payHTML(){
  const k=P.m.kind,rows=[['ベル（1ライン）',k==='sanj'?'押し順正解9枚／不正解1枚':'8枚'],['リプレイ','もう1回無料'],['チェリー（左リールのどこでも）',(k==='fuku'?'4枚':'2枚')+`。${Math.round(P.m.dup*100)}%でボーナスも同時に当たっている`],...(k==='fuku'?[['スイカ（1ライン）','12枚']]:[]),
    ['7・7・7',k==='fuku'?`BIG ${BIG_G}G。毎ゲーム左リールを滑らせずに、上から7・リプレイ・7の形で止める（中段がリプレイ）。成功${BITA_OK}枚、失敗${BITA_NG}枚`:k==='sanj'?`侍ラッシュ ${AT_G}G（押し順ナビ）`:`扉チャンス。前兆${ZEN_G}Gの間、中リールに赤7を止めると扉-1、中段に滑りなしで止めると扉-2。最後に8択`],...(P.m.reg?[['7・7・BAR',`REG ${REG_G}G。毎ゲーム${REG_PAY}枚`]]:[])];
  return `<div class="res" style="font-size:13px;grid-template-columns:auto 1fr">${rows.map(([a,b])=>`<span>${a}</span><b style="font-family:var(--body);font-weight:500;text-align:left">${b}</b>`).join('')}</div>
  <p class="sub" style="margin-top:6px">天井：最後の当たりから${CEIL[P.m.kind]}Gで必ずボーナス。1回3枚。左リールから止める「順押し」なら、ベルとリプレイは必ずそろいます。左以外から止める「変則押し」では取りこぼすことがあります。ボーナスはレバーを引いた時か、リールが止まった後にランプで知らせます。左と中は赤7、右リールに7が止まればBIG、BARが滑ってくればREGです（右の7の2コマ上にBAR）。そろえるラインは5本のどれでもかまいません。BARが一列に並ぶのはリーチ目です。通常時は左リールにBARを狙っておくと、チェリーもスイカも取りこぼしません。</p>`;
}
function tick(){const sk=Math.random()<.1*S.upg.body;if(P.g%12===0&&!sk)S.hun=clamp(S.hun-1);if(P.g%20===0&&!sk)S.hp=clamp(S.hp-1);if(P.g%15===0)S.fun=clamp(S.fun+1);if(S.hun<=0&&P.g%5===0)S.hp=clamp(S.hp-1)}
function doorHTML(){return `<p class="lead" style="text-align:center;font-size:18px">8つの扉から1つ選べ（残り${P.doors.length}）</p><div class="picks p8">${[0,1,2,3,4,5,6,7].map(d=>`<button class="door ${P.doors.includes(d)?'':'gone'}" type="button" data-a="door" data-d="${d}" ${P.doors.includes(d)?'':'disabled'}>${d+1}</button>`).join('')}</div><p class="sub">当たりなら ${DOOR_WIN}枚、外れでも ${DOOR_LOSE}枚</p>`}
function contHTML(){return `<p class="lead" style="text-align:center;font-size:18px">継続をかけた3択。正解なら +${AT_ADD}G</p><div class="picks p3">${['左','中','右'].map((n,i)=>`<button class="door" type="button" data-a="cont" data-d="${i}">${n}</button>`).join('')}</div>`}
function pickDoor(d){
  const win=d===P.winDoor;gain(win?DOOR_WIN:DOOR_LOSE,win?'扉 大当たり '+DOOR_WIN+'枚':'扉 外れ '+DOOR_LOSE+'枚');
  if(win){cutin('大当たり');SND.fan();S.fun=clamp(S.fun+12)}else S.fun=clamp(S.fun+4);
  P.mode='normal';P.doors=null;save();renderPlay();
}
function pickCont(d){
  if(d===P.contWin){P.mode='at';P.left=AT_ADD;cutin('継続');SND.fan();P.log.push('3択正解 ラッシュ継続')}else{P.mode='normal';P.log.push('ラッシュ終了');S.fun=clamp(S.fun+6)}
  save();renderPlay();
}
function randomStops(){for(let t=0;t<60;t++){reels.forEach(r=>{r.pos=Math.floor(Math.random()*N);r.final=r.pos;r.state='stop'});const fs=reels.map(r=>r.pos);if(!lineWins(fs,reels).length&&!bonusLines(fs,reels,'R7').length&&!bonusLines(fs,reels,'BAR').length&&![0,1,2].some(row=>['CH','WM'].includes(symAt(reels[0],fs[0],row))))break}if(P)P.wins=null}
async function autoPlay(){
  if(P.spinning||P.autoRun)return;P.autoRun=true;sync();
  for(let n=0;n<10;n++){
    if(P.g>=CLOSE_MIN-OPEN_MIN){P.autoRun=false;return quit(true)}
    if(P.medals<3&&!borrow()){toast('お金が足りません');break}
    const f=roll(mach(),P.s,Math.random()),k=P.m.kind;
    P.since++;if(P.since>=CEIL[k]){P.pend='BIG';P.ceilHit=true;P.since--;break}
    if(f==='BIG'||f==='REG'){P.pend=f;P.since--;break}
    P.medals-=3;P.g++;tick();
    if(f==='RP')gain(PAY.RP);
    else if(f==='BL'){if(k==='sanj'){const ok=Math.random()<1/3;gain(ok?PAY.BLok:PAY.BLng)}else gain(PAY.BL)}
    else if(f==='CH'){if(Math.random()<.67){gain(k==='fuku'?PAY.CHf:PAY.CHo);if(Math.random()<P.m.dup){P.mode='align';P.bonus=P.m.reg&&Math.random()<.4?'REG':'BIG';cutin('チェリー重複');SND.fan();break}}}
    else if(f==='WM'&&k==='fuku'){if(Math.random()<.18)gain(PAY.WM)}
    randomStops();
    $('.counter').outerHTML=counterHTML();status();
    await new Promise(z=>setTimeout(z,110));
    if(S.hp<=0){P.autoRun=false;return collapse()}
  }
  P.autoRun=false;S.play.medals=P.medals;S.play.inv=P.inv;save();
  if(P.pend||P.mode==='align')toast('当たりの気配。ここからは手で打とう');
  renderPlay();
}
function quit(closed){
  const out=P.medals*P.rate,net=out-P.inv;S.money+=out;S.peak=Math.max(S.peak,S.money);
  S.hist.push({day:S.day,hall:P.hall,m:P.m.n,v:net});S.hist=S.hist.slice(-20);
  if(FL()&&FL().ms[P.unit]){FL().ms[P.unit].since=P.since;FL().ms[P.unit].taken=true;FL().ms[P.unit].played=true}
  if(net>=50000)grant('win50');if(P.ev&&P.s===6)grant('six');
  S.phase='evening';S.play=null;const p=P;P=null;stopReelsLoop();save();status();
  $('#view').innerHTML=`<p class="lead">${closed?'閉店の音楽が流れた。':'今日はここまで。'}</p>
  <div class="res"><span>台</span><b>${p.m.n}（設定${p.s}だった）</b><span>回転数</span><b>${p.g}G（台は今 ${p.since}Gハマり）</b><span>BIG・ラッシュ／REG</span><b>${p.big}回／${p.reg||0}回</b><span>投資</span><b>${yen(p.inv)}</b><span>回収</span><b>${yen(out)}</b><span>収支</span><b class="big ${net>=0?'pos':'neg'}">${net>=0?'+':''}${yen(net)}</b></div>
  <button class="btn" type="button" data-a="home">家に帰る</button>`;
}
function collapse(){
  const p=P;quit(false);S.money-=20000;S.hp=30;S.phase='evening';save();status();
  $('#view').insertAdjacentHTML('afterbegin','<p class="lead" style="color:var(--bad)">ホールで倒れて病院に運ばれた。治療費 ¥20,000</p>');
}
function cashOutStale(){const p=S.play;if(!p)return;S.money+=p.medals*p.rate;S.hist.push({day:S.day,hall:p.hall,m:p.m,v:p.medals*p.rate-p.inv});S.play=null;S.phase='evening';save()}

/* ---------- loop for reels ---------- */
let reelRAF=0;
function startReelsLoop(){cancelAnimationFrame(reelRAF);const loop=now=>{if(!P){return}for(const r of reels){if(r.state==='slide'&&now>=r.tEnd){r.state='stop';r.pos=mod(r.final);const f=r.onStop;r.onStop=null;if(f)f()}}if(document.body.contains(cv))drawReels(now);reelRAF=requestAnimationFrame(loop)};reelRAF=requestAnimationFrame(loop)}
function stopReelsLoop(){cancelAnimationFrame(reelRAF)}

/* ---------- routing ---------- */
function route(){if(S.play)cashOutStale();if(P)return renderPlay();renderHome()}
$('#view').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,id=b.dataset.id;
  if(a==='home'){selItem=null;renderHome()}
  else if(a==='sel'){selItem=selItem===id?null:id;renderHome()}
  else if(a==='food'){status();$('#view').innerHTML=shopHTML('ごはん',FOODS,'eat')}
  else if(a==='fun'){status();$('#view').innerHTML=shopHTML('息抜き',PLAYS,'play')}
  else if(a==='eat'||a==='play'){const x=(a==='eat'?FOODS:PLAYS).find(z=>z.id===id);if(spend(x.p)){apply(x.e);save();SND.coin();toast(x.n+'　'+effText(x.e));status();$('#view').innerHTML=shopHTML(a==='eat'?'ごはん':'息抜き',a==='eat'?FOODS:PLAYS,a)}}
  else if(a==='furn')renderFurn();
  else if(a==='buyF'){const it=ITEMS[id];if(spend(it.p)){S.inv[id]=(S.inv[id]||0)+1;save();SND.coin();toast(it.n+'を買った。部屋に置こう');renderFurn()}}
  else if(a==='estate')renderEstate();
  else if(a==='move')moveTo(i);
  else if(a==='job')startJob();
  else if(a==='self')renderSelf();
  else if(a==='ach')renderAch();
  else if(a==='gift'){const H=hallState(hallIdx);if(H.gift!==S.day&&spend(HALLS[hallIdx].gift)){H.gift=S.day;H.friend=Math.min(100,H.friend+8);save();toast('店員さん「いつもありがとうございます」');renderFloor()}}
  else if(a==='ticket'){const ahead=drawTicket();toast(`${FL().ticket}番。先に${ahead}人が台を選んだ`);renderFloor()}
  else if(a==='upg'){const u=UPG[id],l=S.upg[id];if(l<u.max&&spend(u.cost(l))){S.upg[id]++;save();SND.fan();renderSelf()}}
  else if(a==='drops'){if(spend(1500)){S.dropDay=S.day;save();toast('目がすっきりした');renderSelf()}}
  else if(a==='black')renderBlack();
  else if(a==='buyKiban'){if(spend(kibanPrice())){S.kiban++;save();renderBlack()}}
  else if(a==='kiban')roulette(i);
  else if(a==='nokiban')sitDown2(i,false);
  else if(a==='sleep')sleep();
  else if(a==='halls')renderHalls();
  else if(a==='hall'){hallIdx=i;renderFloor()}
  else if(a==='sit')sitDown(i);
  else if(a==='auto')autoPlay();
  else if(a==='quit')quit(false);
  else if(a==='door')pickDoor(+b.dataset.d);
  else if(a==='cont')pickCont(+b.dataset.d);
});
document.addEventListener('keydown',e=>{
  if(!P||e.repeat)return;
  if(e.code==='Space'&&!e.target.closest('button')){e.preventDefault();lever()}
  const k={KeyJ:0,KeyK:1,KeyL:2}[e.code];if(k!==undefined)stopAt(k,e);
});
route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(P)layout()});
connect();
</script>
